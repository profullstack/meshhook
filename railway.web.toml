# Railway configuration for the Web Application (SvelteKit)
#
# See railway.toml for why the packageManager field and the committed
# pnpm-lock.yaml matter to Railpack's package-manager detection.
#
# The Supabase environment variables are gone: the app reads TURSO_DATABASE_URL
# and TURSO_AUTH_TOKEN at runtime, and neither is a build-time input, so nothing
# needs threading through the build command any more.
[build]
buildCommand = "pnpm install --frozen-lockfile && cd apps/web && pnpm run build"

[deploy]
startCommand = "cd apps/web && node build/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
