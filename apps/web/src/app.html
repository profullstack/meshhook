<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Favicon -->
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />

		<!-- Apple Touch Icons (iOS) -->
		<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180x180.png" />
		<link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152x152.png" />
		<link rel="apple-touch-icon" sizes="144x144" href="/icons/apple-touch-icon-144x144.png" />
		<link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-touch-icon-120x120.png" />
		<link rel="apple-touch-icon" sizes="114x114" href="/icons/apple-touch-icon-114x114.png" />
		<link rel="apple-touch-icon" sizes="76x76" href="/icons/apple-touch-icon-76x76.png" />
		<link rel="apple-touch-icon" sizes="72x72" href="/icons/apple-touch-icon-72x72.png" />
		<link rel="apple-touch-icon" sizes="60x60" href="/icons/apple-touch-icon-60x60.png" />
		<link rel="apple-touch-icon" sizes="57x57" href="/icons/apple-touch-icon-57x57.png" />

		<!-- Web App Manifest (PWA) -->
		<link rel="manifest" href="/manifest.json" />

		<!-- Theme Color (for browser chrome) -->
		<meta name="theme-color" content="#ffffff" />

		<!-- iOS Web App -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Your App" />

		<!-- Android -->
		<meta name="mobile-web-app-capable" content="yes" />

		<!-- Windows -->
		<meta name="msapplication-TileColor" content="#ffffff" />
		<meta name="msapplication-config" content="/browserconfig.xml" />
		<meta name="msapplication-TileImage" content="/icons/apple-touch-icon-144x144.png" />

		<!-- Datafa.st Analytics -->
		<script
			defer
			data-website-id="dfid_hOgPW4hKTmIp9MBbuXAQq"
			data-domain="meshhook.com"
			src="https://datafa.st/js/script.js">
		</script>

		<!-- CrawlProof stats -->
		<script data-site="32fc2327-2a83-4401-802a-371df222f679" src="https://crawlproof.com/stats.js" async></script>

		<!-- WebMCP (@profullstack/webmcp): site_info, open_page, and the signed-in person's
		     workflows and runs as read-only tools for the AI agent in their browser. -->
		<script type="module" data-webmcp src="https://cdn.jsdelivr.net/npm/@profullstack/webmcp@0/src/embed.js"
			data-pages='{"workflows":"/workflows","runs":"/runs","secrets":"/secrets","sign_in":"/auth/login"}'></script>
		<script type="module">
			const W = window.ProfullstackWebMCP;
			const get = async (path) => {
				const r = await fetch(path, { credentials: 'same-origin', headers: { accept: 'application/json' } });
				if (r.status === 401) return { error: 'Sign in to meshhook first (/auth/login).' };
				return r.json();
			};
			if (W?.supported) {
				W.registerTools([
					{
						name: 'list_workflows',
						description: "List the signed-in person's meshhook workflows (id, name, trigger, status).",
						inputSchema: { type: 'object', properties: {} },
						annotations: { readOnlyHint: true },
						execute: () => get('/api/workflows')
					},
					{
						name: 'list_runs',
						description: "Recent workflow runs for the signed-in person, newest first. Optional status filter (e.g. failed, completed, running).",
						inputSchema: {
							type: 'object',
							properties: {
								status: { type: 'string', description: 'Only runs in this status' },
								limit: { type: 'integer', minimum: 1, maximum: 200, description: 'Max runs (default 50)' }
							}
						},
						annotations: { readOnlyHint: true },
						execute: ({ status, limit } = {}) => {
							const q = new URLSearchParams();
							if (status) q.set('status', status);
							if (limit) q.set('limit', String(limit));
							return get('/api/runs' + (q.size ? '?' + q : ''));
						}
					}
				]);
			}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
