# Railway configuration for MeshHook.
#
# One service runs both halves of the product via server.mjs: the SvelteKit web
# app (UI, auth, and the /api/hooks/[slug] webhook endpoint) and the queue
# orchestrator. See server.mjs for why they are two child processes rather than
# one Node process.
#
# Historical: meshhook left Railway for dev2 in September 2026, where the
# Dockerfile (Bun) is what builds and runs. Kept in step for reference only.
[build]
buildCommand = "bun install --frozen-lockfile && bun run build"

[deploy]
startCommand = "bun server.mjs"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
